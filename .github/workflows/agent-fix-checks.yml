name: agent-fix-checks

on:
  workflow_run:
    workflows: ["PR Checks"]  # must match pr-checks.yml's `name:` exactly
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-fix-checks-pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  fix-checks:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.pull_requests[0] != null
    uses: mfrancza/agentic-development-workflow/.github/workflows/agent-fix-checks-reusable.yml@v0
    with:
      pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
      agent-login: mfrancza-developer-agent[bot]
      image: ghcr.io/mfrancza/agentic-development-workflow/developer:v0
      helpers-ref: v0
    secrets:
      DEVELOPER_APP_ID: ${{ secrets.DEVELOPER_APP_ID }}
      DEVELOPER_APP_PRIVATE_KEY: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
