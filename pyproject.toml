[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lyrebird-audio"
version = "0.1.0"
description = "Neural audio effect cloning using FIR-inspired deep learning"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "torchcodec>=0.8.0",
    "soundfile>=0.13.0",
]

[project.scripts]
lyrebird-train = "lyrebird_audio.train:main"
lyrebird-export = "lyrebird_audio.export_rtneural:main"
lyrebird-benchmark = "lyrebird_audio.benchmark:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.hatch.build.targets.sdist]
include = ["src/lyrebird_audio/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/lyrebird_audio"]
